    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro</title>

        <!-- Link para o arquivo css -->
        <link rel="stylesheet" href="css/cadastro.css">

        <!-- Link para o arquivo js -->
        <link rel="icon" type="image/png" href="img/devfinder.png">
    </head>
    
        <!-- Conteúdo da página -->
    <body>

    
    <div class="container">

        <h1>Cadastro</h1>

        <p>Crie sua conta para começar.</p>

        <!-- Formulário de cadastro -->
        <form>

            <!-- Campo para o nome completo -->
            <label>Nome Completo</label>
            <input type="text" placeholder="Digite seu nome">

            <!-- Campo para o e-mail -->
            <label>E-mail</label>
            <input type="email" placeholder="Digite seu e-mail">

            <!-- Campo para a senha -->
            <label>Senha</label>
            <input type="password" placeholder="Digite sua senha">

            <!-- Campo para o tipo de conta -->
            <label>Tipo de Conta</label>

            <!-- Opções para o tipo de conta -->
            <select>
                <option>Cliente</option>
                <option>Desenvolvedor</option>
            </select>

            <!-- Botão para criar conta -->
            <button type="submit">
                <a href="dashboard.html"> Criar Conta </a>
            </button>

        </form>

        <!-- Link para a página de login -->
        <p class="login">
            Já possui uma conta?

            <a href="Login.html">
                Fazer Login
            </a>

        </p>

        <!-- Link para voltar para o inicio -->
        <a href="DevFinder.html" class="voltar">
            ← Voltar para página inicial
        </a>

    </div>

    </body>
    </html>
