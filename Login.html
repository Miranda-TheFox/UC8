<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Link para o arquivo css -->
    <link rel="stylesheet" href="css/login.css">
    
    <!-- Link para o arquivo js -->
    <link rel="icon" type="image/png" href="img/devfinder.png">
</head>

    <!-- Cabeçalho da página -->
<body>

    <!-- Conteúdo da página -->
    <div class="container">

        <h1>Login</h1>

        <p>Entre na sua conta.</p>

        <form>

            <!-- Campo para o e-mail -->
            <label>E-mail</label>
            <input type="email" placeholder="Digite seu e-mail">

            <!-- Campo para a senha -->
            <label>Senha</label>
            <input type="password" placeholder="Digite sua senha">

            <!-- Botão para entrar -->
            <button type="submit">
            <a href="Cliente.html"> Entrar </a>
            </button>

        </form>

        <!-- Link para a página de cadastro -->
        <p class="cadastro">
            Ainda não possui uma conta?

            <a href="Cadastro.html">
                Cadastre-se
            </a>

        </p>

        <!-- Link para voltar para o inicio -->
        <a href="DevFinder.html" class="voltar">
            ← Voltar para página inicial
        </a>

    </div>
</body>

</html>
