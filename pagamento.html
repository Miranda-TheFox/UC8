<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento</title>

    <!-- Link para o arquivo css -->
    <link rel="stylesheet" href="css/pagamento.css">
    
    <!-- Link para o arquivo js -->
    <link rel="icon" type="image/png" href="img/devfinder.png">
</head>

<body>

    <!-- Cabeçalho da página -->
    <header>
        <h1>DevFinder</h1>
    </header>

    <!-- Conteúdo da página -->
    <main>

        <h2>Pagamento</h2>

        <div class="container">

            <!-- Formulário de pagamento -->
            <form>

                <!-- Campo para o nome completo -->
                <label>Nome Completo</label>
                <input type="text" placeholder="Digite seu nome">

                <!-- Campo para o CPF -->
                <label>CPF</label>
                <input type="text" placeholder="000.000.000-00">

                <!-- Campo para o número do cartão -->
                <label>Número do Cartão</label>
                <input type="text" placeholder="0000 0000 0000 0000">

                <!-- Campo para a validade -->
                <label>Validade</label>
                <input type="text" placeholder="MM/AA">

                <!-- Campo para o CVV -->
                <label>CVV</label>
                <input type="password" placeholder="123">

                <!-- Botão para finalizar o pagamento -->
                <button type="submit">
                    <a href="dashboard.html"> Finalizar Pagamento </a>
                </button>

            </form>

        </div>

        <!-- Link para voltar para o inicio -->
        <a href="Plano.html" class="voltar">
            ← Voltar
        </a>

    </main>

    <!-- Script para o JS -->
    <script src="js/pagamento.js"></script>

</body>

</html>
